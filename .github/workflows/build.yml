name: Build and publish the cemetery site

on:
  push:
    branches: [main]
    # The run commits the regenerated docs/ back to main. Ignoring those paths
    # keeps that commit from starting another run.
    paths-ignore:
      - "site-repo/docs/**"
  workflow_dispatch:
  schedule:
    # Twice a day, about 7am and 7pm US Central.
    - cron: "0 12 * * *"
    - cron: "0 0 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests

      - name: Build the site
        run: python3 site-repo/build/build.py

      - name: Commit the regenerated data if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site-repo/docs/data/public.json site-repo/docs/data/monuments.json site-repo/docs/*.html
          if git diff --cached --quiet; then
            echo "No data change, nothing to commit."
          else
            git commit -m "Rebuild site data from the sheet [skip ci]"
            git push origin HEAD:main
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-repo/docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
